<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Collage Maker - Anshul Photo Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#07111f,#172554,#581c87);
  color:white;
}

header{
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,.35);
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-weight:bold;
  font-size:20px;
}

.home{
  color:white;
  text-decoration:none;
  background:rgba(255,255,255,.15);
  padding:9px 14px;
  border-radius:10px;
}

.container{
  width:min(1050px,94%);
  margin:auto;
  padding:25px 0 50px;
}

.title{
  text-align:center;
  margin-bottom:22px;
}

.title h1{
  font-size:32px;
  margin-bottom:8px;
}

.title p{
  opacity:.8;
}

.card{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.13);
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
}

.upload{
  text-align:center;
  border:2px dashed rgba(255,255,255,.35);
  padding:25px;
  border-radius:16px;
}

#fileInput{
  display:none;
}

.upload label{
  display:inline-block;
  padding:13px 23px;
  border-radius:12px;
  background:linear-gradient(90deg,#7c3aed,#ec4899);
  cursor:pointer;
  font-weight:bold;
}

.controls{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.control label{
  display:block;
  margin-bottom:7px;
  font-size:14px;
}

select,
input[type=color],
input[type=range]{
  width:100%;
}

select{
  padding:11px;
  border-radius:10px;
  background:#0f172a;
  color:white;
  border:1px solid #475569;
}

input[type=color]{
  height:42px;
  border:none;
  border-radius:10px;
}

.preview{
  background:#111827;
  border-radius:18px;
  padding:15px;
  text-align:center;
  overflow:auto;
}

canvas{
  max-width:100%;
  border-radius:8px;
  background:white;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

button{
  border:0;
  padding:13px;
  border-radius:11px;
  background:#334155;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.download{
  background:#16a34a;
}

.reset{
  background:#dc2626;
}

.status{
  text-align:center;
  margin-top:12px;
  opacity:.75;
  font-size:13px;
}

@media(max-width:650px){
  .controls{
    grid-template-columns:1fr;
  }

  .buttons{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">📸 Anshul Photo Hub</div>
  <a class="home" href="index.html">← Home</a>
</header>

<div class="container">

<div class="title">
  <h1>🖼️ Collage Maker</h1>
  <p>Create beautiful photo collages instantly</p>
</div>

<div class="card">

<div class="upload">

<input
  type="file"
  id="fileInput"
  accept="image/*"
  multiple
>

<label for="fileInput">
  📁 Choose Photos
</label>

<p style="margin-top:10px">
  Select 2 to 6 photos
</p>

</div>

</div>

<div class="card">

<h2 style="margin-bottom:15px">
  ⚙️ Collage Settings
</h2>

<div class="controls">

<div class="control">
<label>Layout</label>

<select id="layout">

<option value="grid">Grid</option>
<option value="horizontal">Horizontal</option>
<option value="vertical">Vertical</option>
<option value="featured">Featured</option>
<option value="film">Film Strip</option>

</select>

</div>

<div class="control">
<label>Background</label>

<input
  type="color"
  id="bgColor"
  value="#ffffff"
>

</div>

<div class="control">

<label>
Spacing:
<span id="spacingValue">10</span> px
</label>

<input
  type="range"
  id="spacing"
  min="0"
  max="40"
  value="10"
>

</div>

<div class="control">

<label>
Rounded Corners:
<span id="radiusValue">8</span> px
</label>

<input
  type="range"
  id="radius"
  min="0"
  max="40"
  value="8"
>

</div>

</div>

</div>

<div class="card">

<div class="preview">

<canvas id="canvas"></canvas>

</div>

<div class="buttons">

<button
  class="download"
  onclick="downloadCollage()"
>
⬇️ Download Collage
</button>

<button
  class="reset"
  onclick="resetAll()"
>
♻️ Reset
</button>

</div>

<div
  class="status"
  id="status"
>
No photos selected
</div>

</div>

</div>

<script>

const fileInput=
document.getElementById("fileInput");

const canvas=
document.getElementById("canvas");

const ctx=
canvas.getContext("2d");

const layout=
document.getElementById("layout");

const bgColor=
document.getElementById("bgColor");

const spacing=
document.getElementById("spacing");

const radius=
document.getElementById("radius");

const spacingValue=
document.getElementById("spacingValue");

const radiusValue=
document.getElementById("radiusValue");

const status=
document.getElementById("status");

let images=[];

fileInput.addEventListener(
"change",
function(){

  const files=
  Array.from(this.files).slice(0,6);

  if(files.length<2){

    alert(
      "Please select at least 2 photos."
    );

    return;
  }

  images=[];

  let loaded=0;

  files.forEach(file=>{

    const reader=
    new FileReader();

    reader.onload=function(e){

      const img=
      new Image();

      img.onload=function(){

        images.push(img);

        loaded++;

        if(loaded===files.length){

          status.textContent=
            images.length+
            " photos loaded";

          drawCollage();
        }

      };

      img.src=e.target.result;

    };

    reader.readAsDataURL(file);

  });

});

layout.addEventListener(
"change",
drawCollage
);

bgColor.addEventListener(
"input",
drawCollage
);

spacing.addEventListener(
"input",
function(){

  spacingValue.textContent=
    this.value;

  drawCollage();

});

radius.addEventListener(
"input",
function(){

  radiusValue.textContent=
    this.value;

  drawCollage();

});


function roundedImage(
  ctx,
  img,
  x,
  y,
  w,
  h,
  r
){

  r=Math.min(
    r,
    w/2,
    h/2
  );

  ctx.save();

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.lineTo(x+w-r,y);

  ctx.quadraticCurveTo(
    x+w,
    y,
    x+w,
    y+r
  );

  ctx.lineTo(
    x+w,
    y+h-r
  );

  ctx.quadraticCurveTo(
    x+w,
    y+h,
    x+w-r,
    y+h
  );

  ctx.lineTo(
    x+r,
    y+h
  );

  ctx.quadraticCurveTo(
    x,
    y+h,
    x,
    y+h-r
  );

  ctx.lineTo(
    x,
    y+r
  );

  ctx.quadraticCurveTo(
    x,
    y,
    x+r,
    y
  );

  ctx.closePath();

  ctx.clip();

  drawCover(
    ctx,
    img,
    x,
    y,
    w,
    h
  );

  ctx.restore();

}


function drawCover(
  ctx,
  img,
  x,
  y,
  w,
  h
){

  const ir=
    img.width/img.height;

  const br=
    w/h;

  let dw,dh;

  if(ir>br){

    dh=h;
    dw=h*ir;

  }else{

    dw=w;
    dh=w/ir;

  }

  ctx.drawImage(
    img,
    x+(w-dw)/2,
    y+(h-dh)/2,
    dw,
    dh
  );

}


function prepareCanvas(
  width,
  height
){

  canvas.width=width;
  canvas.height=height;

  ctx.fillStyle=
    bgColor.value;

  ctx.fillRect(
    0,
    0,
    width,
    height
  );

}


function drawCollage(){

  if(images.length<2)
    return;

  const gap=
    Number(spacing.value);

  const r=
    Number(radius.value);

  const type=
    layout.value;

  const W=1000;

  let H=750;

  if(type==="horizontal")
    H=300;

  if(type==="vertical")
    H=1000;

  if(type==="film")
    H=350;

  prepareCanvas(W,H);

  if(type==="horizontal"){

    const cellW=
      (W-gap*(images.length+1))/
      images.length;

    images.forEach(
      (img,i)=>{

        roundedImage(
          ctx,
          img,
          gap+i*(cellW+gap),
          gap,
          cellW,
          H-gap*2,
          r
        );

      }
    );

  }

  else if(type==="vertical"){

    const cellH=
      (H-gap*(images.length+1))/
      images.length;

    images.forEach(
      (img,i)=>{

        roundedImage(
          ctx,
          img,
          gap,
          gap+i*(cellH+gap),
          W-gap*2,
          cellH,
          r
        );

      }
    );

  }

  else if(type==="featured"){

    const mainW=
      W*0.58;

    roundedImage(
      ctx,
      images[0],
      gap,
      gap,
      mainW-gap*1.5,
      H-gap*2,
      r
    );

    const sideW=
      W-mainW-gap*2;

    const sideH=
      (H-gap*3)/
      Math.max(1,images.length-1);

    for(
      let i=1;
      i<images.length;
      i++
    ){

      roundedImage(
        ctx,
        images[i],
        mainW+gap,
        gap+(i-1)*(sideH+gap),
        sideW,
        sideH,
        r
      );

    }

  }

  else if(type==="film"){

    const cellW=
      (W-gap*(images.length+1))/
      images.length;

    images.forEach(
      (img,i)=>{

        roundedImage(
          ctx,
          img,
          gap+i*(cellW+gap),
          gap,
          cellW,
          H-gap*2,
          r
        );

      }
    );

  }

  else{

    /*
      Automatic grid
    */

    let columns=2;

    if(images.length===3)
      columns=2;

    if(images.length>=5)
      columns=3;

    const rows=
      Math.ceil(
        images.length/columns
      );

    const cellW=
      (W-gap*(columns+1))/
      columns;

    const cellH=
      (H-gap*(rows+1))/
      rows;

    images.forEach(
      (img,i)=>{

        const col=
          i%columns;

        const row=
          Math.floor(i/columns);

        roundedImage(
          ctx,
          img,
          gap+col*(cellW+gap),
          gap+row*(cellH+gap),
          cellW,
          cellH,
          r
        );

      }
    );

  }

}


function downloadCollage(){

  if(images.length<2){

    alert(
      "Please select at least 2 photos first."
    );

    return;
  }

  const link=
    document.createElement("a");

  link.download=
    "Anshul-Photo-Hub-Collage.png";

  link.href=
    canvas.toDataURL(
      "image/png"
    );

  link.click();

}


function resetAll(){

  images=[];

  fileInput.value="";

  layout.value="grid";

  bgColor.value="#ffffff";

  spacing.value=10;

  radius.value=8;

  spacingValue.textContent="10";

  radiusValue.textContent="8";

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  status.textContent=
    "No photos selected";

}

</script>

</body>
</html>
