<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Effects - Anshul Photo Hub</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#111827,#312e81,#701a75);
    color:white;
}

header{
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(12px);
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.back{
    color:white;
    text-decoration:none;
    background:rgba(255,255,255,.15);
    padding:10px 16px;
    border-radius:12px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 15px 50px;
}

.title{
    text-align:center;
    margin-bottom:22px;
}

.title h1{
    font-size:34px;
    margin-bottom:8px;
}

.title p{
    opacity:.8;
}

.upload{
    background:rgba(255,255,255,.1);
    border:2px dashed rgba(255,255,255,.4);
    border-radius:20px;
    padding:28px;
    text-align:center;
    margin-bottom:20px;
}

.upload input{
    display:none;
}

.upload label{
    display:inline-block;
    padding:14px 25px;
    background:linear-gradient(90deg,#7c3aed,#ec4899);
    border-radius:14px;
    cursor:pointer;
    font-weight:bold;
}

.editor{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:20px;
}

.preview{
    min-height:400px;
    background:rgba(0,0,0,.35);
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
    overflow:hidden;
}

canvas{
    max-width:100%;
    max-height:600px;
    border-radius:12px;
    display:none;
}

.placeholder{
    text-align:center;
    opacity:.6;
}

.controls{
    background:rgba(255,255,255,.1);
    border-radius:20px;
    padding:20px;
}

.control{
    margin-bottom:16px;
}

.control label{
    display:flex;
    justify-content:space-between;
    margin-bottom:7px;
    font-size:14px;
}

input[type=range]{
    width:100%;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:15px;
}

button{
    border:0;
    padding:12px;
    border-radius:11px;
    color:white;
    background:rgba(255,255,255,.15);
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:rgba(255,255,255,.28);
}

.download{
    width:100%;
    margin-top:12px;
    background:linear-gradient(90deg,#16a34a,#059669);
}

.reset{
    width:100%;
    margin-top:8px;
    background:#dc2626;
}

@media(max-width:800px){
    .editor{
        grid-template-columns:1fr;
    }

    .preview{
        min-height:300px;
    }

    .title h1{
        font-size:28px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">📸 Anshul Photo Hub</div>
    <a href="index.html" class="back">← Home</a>
</header>

<div class="container">

<div class="title">
    <h1>✨ AI Photo Effects</h1>
    <p>Transform your photos with powerful effects</p>
</div>

<div class="upload">
    <input type="file" id="upload" accept="image/*">
    <label for="upload">📁 Choose Photo</label>
    <p style="margin-top:12px;">Upload JPG, PNG or WEBP</p>
</div>

<div class="editor">

<div class="preview">
    <div class="placeholder" id="placeholder">
        <div style="font-size:50px;">🖼️</div>
        <p>Your photo will appear here</p>
    </div>

    <canvas id="canvas"></canvas>
</div>

<div class="controls">

    <div class="control">
        <label>
            Brightness
            <span id="brightnessValue">100%</span>
        </label>
        <input type="range" id="brightness" min="0" max="200" value="100">
    </div>

    <div class="control">
        <label>
            Contrast
            <span id="contrastValue">100%</span>
        </label>
        <input type="range" id="contrast" min="0" max="200" value="100">
    </div>

    <div class="control">
        <label>
            Saturation
            <span id="saturationValue">100%</span>
        </label>
        <input type="range" id="saturation" min="0" max="200" value="100">
    </div>

    <div class="control">
        <label>
            Grayscale
            <span id="grayValue">0%</span>
        </label>
        <input type="range" id="gray" min="0" max="100" value="0">
    </div>

    <div class="control">
        <label>
            Sepia
            <span id="sepiaValue">0%</span>
        </label>
        <input type="range" id="sepia" min="0" max="100" value="0">
    </div>

    <div class="control">
        <label>
            Blur
            <span id="blurValue">0px</span>
        </label>
        <input type="range" id="blur" min="0" max="10" value="0">
    </div>

    <div class="control">
        <label>
            Hue
            <span id="hueValue">0°</span>
        </label>
        <input type="range" id="hue" min="0" max="360" value="0">
    </div>

    <div class="buttons">
        <button onclick="rotateLeft()">↶ Rotate</button>
        <button onclick="rotateRight()">↷ Rotate</button>
        <button onclick="flipH()">↔ Flip H</button>
        <button onclick="flipV()">↕ Flip V</button>
    </div>

    <button class="reset" onclick="resetAll()">Reset Effects</button>

    <button class="download" onclick="downloadImage()">
        ⬇ Download Edited Photo
    </button>

</div>
</div>
</div>

<script>

const upload = document.getElementById("upload");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const placeholder = document.getElementById("placeholder");

let image = new Image();
let rotation = 0;
let flipX = 1;
let flipY = 1;

const controls = {
    brightness:100,
    contrast:100,
    saturation:100,
    gray:0,
    sepia:0,
    blur:0,
    hue:0
};

upload.addEventListener("change",function(){

    const file = this.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload=function(e){

        image.onload=function(){

            canvas.style.display="block";
            placeholder.style.display="none";

            draw();
        };

        image.src=e.target.result;
    };

    reader.readAsDataURL(file);
});

function updateValue(id,value){

    controls[id]=Number(value);

    document.getElementById(id+"Value").textContent =
        id==="blur" ? value+"px" :
        id==="hue" ? value+"°" :
        value+"%";

    draw();
}

["brightness","contrast","saturation","gray","sepia","blur","hue"]
.forEach(id=>{

    document.getElementById(id)
    .addEventListener("input",function(){

        updateValue(id,this.value);

    });

});

function draw(){

    if(!image.src) return;

    let w=image.naturalWidth;
    let h=image.naturalHeight;

    if(rotation%180!==0){
        canvas.width=h;
        canvas.height=w;
    }else{
        canvas.width=w;
        canvas.height=h;
    }

    ctx.save();

    ctx.translate(canvas.width/2,canvas.height/2);

    ctx.rotate(rotation*Math.PI/180);

    ctx.scale(flipX,flipY);

    let filter =
        `brightness(${controls.brightness}%)
         contrast(${controls.contrast}%)
         saturate(${controls.saturation}%)
         grayscale(${controls.gray}%)
         sepia(${controls.sepia}%)
         blur(${controls.blur}px)
         hue-rotate(${controls.hue}deg)`;

    ctx.filter=filter;

    ctx.drawImage(
        image,
        -w/2,
        -h/2,
        w,
        h
    );

    ctx.restore();

    ctx.filter="none";
}

function rotateLeft(){
    rotation-=90;
    draw();
}

function rotateRight(){
    rotation+=90;
    draw();
}

function flipH(){
    flipX*=-1;
    draw();
}

function flipV(){
    flipY*=-1;
    draw();
}

function resetAll(){

    controls.brightness=100;
    controls.contrast=100;
    controls.saturation=100;
    controls.gray=0;
    controls.sepia=0;
    controls.blur=0;
    controls.hue=0;

    rotation=0;
    flipX=1;
    flipY=1;

    document.getElementById("brightness").value=100;
    document.getElementById("contrast").value=100;
    document.getElementById("saturation").value=100;
    document.getElementById("gray").value=0;
    document.getElementById("sepia").value=0;
    document.getElementById("blur").value=0;
    document.getElementById("hue").value=0;

    document.getElementById("brightnessValue").textContent="100%";
    document.getElementById("contrastValue").textContent="100%";
    document.getElementById("saturationValue").textContent="100%";
    document.getElementById("grayValue").textContent="0%";
    document.getElementById("sepiaValue").textContent="0%";
    document.getElementById("blurValue").textContent="0px";
    document.getElementById("hueValue").textContent="0°";

    draw();
}

function downloadImage(){

    if(!image.src){
        alert("Please upload a photo first.");
        return;
    }

    const link=document.createElement("a");

    link.download="Anshul-Photo-Hub-Edited.png";
    link.href=canvas.toDataURL("image/png");

    link.click();
}

</script>

</body>
</html>
